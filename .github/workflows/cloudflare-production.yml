name: Publicar producción en Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-production
      url: https://doc-central-website.pages.dev
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar producción
        run: npm run build
        env:
          VITE_SALES_EMAIL: ${{ vars.VITE_SALES_EMAIL }}
          VITE_PURCHASE_URL: ${{ vars.VITE_PURCHASE_URL }}
          VITE_DEMO_URL: ${{ vars.VITE_DEMO_URL }}
          VITE_PRICE_LABEL: ${{ vars.VITE_PRICE_LABEL }}

      - name: Publicar en Cloudflare Pages
        run: >-
          npx --yes wrangler@4.162.0 pages deploy dist
          --project-name doc-central-website
          --branch main
          --commit-hash "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
