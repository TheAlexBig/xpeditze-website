name: Vista previa en GitHub Pages

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar vista previa
        run: npm run build
        env:
          GITHUB_PAGES_PREVIEW: 'true'
          VITE_SALES_EMAIL: ${{ vars.VITE_SALES_EMAIL }}
          VITE_PURCHASE_URL: ${{ vars.VITE_PURCHASE_URL }}
          VITE_DEMO_URL: ${{ vars.VITE_DEMO_URL }}
          VITE_PRICE_LABEL: ${{ vars.VITE_PRICE_LABEL }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar vista previa
        id: deployment
        uses: actions/deploy-pages@v5
